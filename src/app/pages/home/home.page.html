<ion-content [scrollY]="false">

  <div class="page-body">

    <!-- Topbar compacto: solo el botón de refresh (safe-area incluida) -->
    <div class="page-topbar">
      <button class="topbar-refresh-btn" (click)="refresh()" aria-label="Refrescar GPS">
        <ion-icon name="refresh-outline" />
      </button>
    </div>

    <!-- GPS error / denied -->
    @if (geo.status() === 'denied') {
      <div class="gps-pill gps-pill--error">
        <span class="gps-dot gps-dot--error"></span>
        Permiso de ubicación denegado — actívalo en Ajustes
      </div>
    }

    @if (geo.status() === 'error') {
      <div class="gps-pill gps-pill--error">
        <span class="gps-dot gps-dot--error"></span>
        {{ geo.error() }}
      </div>
    }

    <!-- GPS acquiring (no position yet) -->
    @if (geo.status() === 'watching' && !geo.position()) {
      <div class="gps-pill gps-pill--acquiring">
        <span class="gps-dot gps-dot--acquiring"></span>
        Buscando señal GPS…
      </div>
    }

    <!-- Position card -->
    <app-position-card [position]="geo.position()" />

    <!-- Map label -->
    <div class="map-section-label">
      <span class="label-micro">MAPA · toca: leer grid · mantener: guardar pin</span>
    </div>

    <!-- Map — ocupa el espacio vertical restante -->
    <app-map-view
      [center]="center()"
      [accuracy]="accuracy()"
      [gridBounds]="gridBounds()"
      [gridLabel]="gridLabel()"
      [plusBounds]="plusBounds()"
      [plusLabel]="plusLabel()"
      [tapGridBounds]="tapGridBounds()"
      [tapGridLabel]="tapGridLabel()"
      [savedMarkers]="savedPins()"
      (mapTap)="onMapTap($event)"
      (mapLongPress)="onMapLongPress($event)" />

  </div>

</ion-content>

<!-- FAB: nuevo QSO -->
<ion-fab vertical="bottom" horizontal="end" slot="fixed">
  <ion-fab-button (click)="newQso()" aria-label="Nuevo QSO" class="fab-qso">
    <ion-icon name="add-outline" />
    <span class="fab-qso-label">QSO</span>
  </ion-fab-button>
</ion-fab>

<ion-toast
  [isOpen]="showToast()"
  [message]="toastMsg()"
  [duration]="3000"
  (didDismiss)="onToastDismiss()"
  position="top" />
