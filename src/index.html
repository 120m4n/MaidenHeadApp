<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8"/>
  <title>MaidenHead · QTH Locator</title>

  <base href="/"/>

  <meta name="color-scheme" content="light dark"/>
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="format-detection" content="telephone=no"/>
  <meta name="msapplication-tap-highlight" content="no"/>

  <link rel="icon" type="image/png" href="icons/icon-72x72.png"/>


  <!-- SDR Cockpit fonts — Share Tech Mono (data) + Barlow Condensed (UI) -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600;700&amp;family=Share+Tech+Mono&amp;display=swap" rel="stylesheet"/>

  <!-- PWA: theme & manifest -->
  <meta name="theme-color" content="#0f1a22"/>
  <link rel="manifest" href="manifest.webmanifest"/>

  <script>
    (function () {
      try {
        var keys = ['app_settings', 'CapacitorStorage.app_settings', '_cap_app_settings'];
        var raw = null;

        for (var i = 0; i < keys.length && !raw; i++) {
          raw = localStorage.getItem(keys[i]);
        }

        if (!raw) return;

        var parsed = JSON.parse(raw);
        var themeMode = parsed && typeof parsed.themeMode === 'string' ? parsed.themeMode : null;
        var doc = document.documentElement;

        if (themeMode === 'dark') {
          doc.setAttribute('data-theme', 'dark');
        } else if (themeMode === 'light') {
          doc.setAttribute('data-theme', 'light');
        } else {
          doc.removeAttribute('data-theme');
        }
      } catch (_err) {
        // Silent on purpose: this is a best-effort optimization.
      }
    })();
  </script>

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="MaidenHead"/>
</head>

<body>
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>

</html>
