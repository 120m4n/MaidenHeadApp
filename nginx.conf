server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # ── Compresión gzip ──────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ── Assets con hash (JS/CSS/imgs) — caché 1 año, immutable ─────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── PWA: Service Worker y manifesto — sin caché (siempre frescos) ───────
    location ~* (ngsw-worker\.js|manifest\.webmanifest|ngsw\.json)$ {
        expires    -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ── SPA fallback — Angular Router (HTML5 history) ────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
