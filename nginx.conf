server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # ── Compresión gzip ──────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ── Assets con hash (JS/CSS/imgs) — caché 1 año, immutable ─────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── PWA: Service Worker y manifesto — sin caché (siempre frescos) ───────
    location ~* (ngsw-worker\.js|manifest\.webmanifest|ngsw\.json)$ {
        expires    -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ── WebSocket gateway → NATS JetStream ──────────────────────────────────
    # El browser conecta a ws://<host>/nats-ws y nginx proxea al contenedor
    # nats en la red interna Docker (puerto 4223). Así el cliente no necesita
    # conocer ni exponer el puerto de NATS directamente.
    location /nats-ws {
        proxy_pass         http://nats:4223/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── SPA fallback — Angular Router (HTML5 history) ────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
