services:
  maidenheadapp:
    image: ghcr.io/120m4n/maidenheadapp:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maidenheadapp
    platform: linux/amd64
    ports:
      - "8087:80"
    depends_on:
      - nats
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/app.conf:ro
      - ./geojson.json:/usr/share/nginx/html/geojson.json:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nats:
    image: nats:2.10-alpine
    container_name: nats-mh
    command: ["--config", "/etc/nats/nats.conf"]
    volumes:
      - ./presence/nats.conf:/etc/nats/nats.conf:ro
      - nats-data:/data
    ports:
      - "4222:4222"   # TCP: test-bed / CLI debug
      # 4223 (WS) solo accesible internamente vía nginx /nats-ws
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  nats-data:
