services:
  maidenheadapp:
    image: ghcr.io/120m4n/maidenheadapp:${APP_VERSION:-latest}
    container_name: maidenheadapp
    platform: linux/amd64
    ports:
      - "8087:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
