services:
  maidenheadapp:
    image: ghcr.io/120m4n/maidenheadapp:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maidenheadapp
    platform: linux/amd64
    ports:
      - "8087:80"
    restart: unless-stopped
    volumes:
      - ./geojson.json:/usr/share/nginx/html/geojson.json:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nats:
    image: nats:2.10-alpine
    container_name: nats-mh
    command: ["--config", "/etc/nats/nats.conf"]
    volumes:
      - ./presence/nats.conf:/etc/nats/nats.conf:ro
      - nats-data:/data
    ports:
      - "4222:4222"
      - "4223:4223"
    restart: unless-stopped

volumes:
  nats-data:
